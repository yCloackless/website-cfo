services:
  postgres:
    image: postgres:16-alpine
    container_name: cfo_cbmerj_postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cfo_app_dev}
      POSTGRES_USER: ${POSTGRES_USER:-cfo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  cfo-terminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: cfo-cbmerj-terminal:latest
    container_name: cfo_cbmerj_app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-cfo_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cfo_app_dev}}
    env_file:
      - .env
    volumes:
      - cfo_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backup-offsite:
    image: amazon/aws-cli:2
    profiles: ["offsite"]
    environment:
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
    volumes:
      - cfo_data:/backup:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      test -n "$$AWS_ACCESS_KEY_ID" -a -n "$$AWS_SECRET_ACCESS_KEY" -a
      -n "$$BACKUP_S3_BUCKET" -a -n "$$BACKUP_S3_ENDPOINT" ||
      { echo 'Configure BACKUP_S3_* no .env antes do upload offsite.'; exit 2; };
      aws s3 sync /backup/backups "s3://$$BACKUP_S3_BUCKET/"
      --endpoint-url "$$BACKUP_S3_ENDPOINT" --only-show-errors

volumes:
  cfo_data:
    driver: local
  postgres_data:
    driver: local
