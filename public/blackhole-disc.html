<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Disco de acreção — point cloud</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;cursor:grab}canvas:active{cursor:grabbing}</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

const COUNT = 26000;
const LANES = 6.0;
const DISC_TILT = THREE.MathUtils.degToRad(63);
const positions = new Float32Array(COUNT * 3);
const radii = new Float32Array(COUNT);
const phaseNoise = new Float32Array(COUNT);

// A direção inicial vem de uma esfera de Fibonacci. O raio do disco é
// independente e concentrado para que a borda tenha bastante material.
for (let i = 0; i < COUNT; i++) {
  const y = 1 - (i / (COUNT - 1)) * 2;
  const shellRadius = Math.sqrt(Math.max(0, 1 - y * y));
  const theta = Math.PI * (3 - Math.sqrt(5)) * i;
  positions[i * 3] = Math.cos(theta) * shellRadius;
  positions[i * 3 + 1] = y;
  positions[i * 3 + 2] = Math.sin(theta) * shellRadius;
  radii[i] = 0.9 + Math.pow(Math.random(), 0.55) * 2.6;
  // Box-Muller: ruído gaussiano pequeno na fase das faixas.
  const u = Math.max(Number.EPSILON, Math.random());
  const v = Math.max(Number.EPSILON, Math.random());
  phaseNoise[i] = Math.sqrt(-2 * Math.log(u)) * Math.cos(Math.PI * 2 * v) * 0.22;
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('aRadius', new THREE.BufferAttribute(radii, 1));
geometry.setAttribute('aPhaseNoise', new THREE.BufferAttribute(phaseNoise, 1));

const material = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  depthTest: false,
  blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 }, uPointScale: { value: 2.0 } },
  vertexShader: `
    attribute float aRadius;
    attribute float aPhaseNoise;
    uniform float uTime;
    uniform float uPointScale;
    varying float vBrightness;
    varying float vVisible;

    void main() {
      float r = aRadius;
      float theta0 = atan(position.z, position.x);

      // Kepler: os raios internos têm velocidade angular maior. As faixas
      // aparecem pela rotação diferencial, sem animar braços prontos.
      float ang = theta0 + uTime * pow(r, -1.5);
      float lane = sin(6.0 * theta0 - 3.4 * log(r) + aPhaseNoise);
      float b = clamp(0.18 + 0.9 * max(lane, 0.0), 0.0, 1.0);
      // CRÍTICO: deslocamos a posição angular, acumulando pontos de verdade.
      ang += (b - 0.5) * 0.35;
      vBrightness = b * b;

      // O eixo Y da casca é achatado por 0.03*r; depois o disco inteiro é
      // inclinado em X no espaço do objeto.
      float thickness = 0.03 * r;
      vec3 p = vec3(cos(ang) * r, position.y * thickness, sin(ang) * r);
      float c = cos(${DISC_TILT.toFixed(8)});
      float s = sin(${DISC_TILT.toFixed(8)});
      p.yz = mat2(c, -s, s, c) * p.yz;

      vec4 viewPoint = modelViewMatrix * vec4(p, 1.0);
      vec3 ray = normalize(viewPoint.xyz);
      // O centro do buraco é a origem. Em view-space ele é c; resolvemos
      // |t*ray-c|² = R². Só escondemos o ponto se ele está atrás da esfera:
      // pontos da frente continuam passando por cima da sombra.
      vec3 sphereCenter = (modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
      float sphereRadius = 0.43;
      float halfB = dot(ray, -sphereCenter);
      float discriminant = halfB * halfB - dot(sphereCenter, sphereCenter) + sphereRadius * sphereRadius;
      float nearHit = halfB - sqrt(max(discriminant, 0.0));
      float pointDistance = length(viewPoint.xyz);
      vVisible = (discriminant > 0.0 && nearHit > 0.0 && pointDistance > nearHit) ? 0.0 : 1.0;

      gl_Position = projectionMatrix * viewPoint;
      // Ponto proporcional à distância: perto fica macio/estourado, longe
      // fica menor que um pixel e nítido.
      gl_PointSize = uPointScale * (0.4 + vBrightness * 2.2) * (300.0 / max(1.0, -viewPoint.z));
    }
  `,
  fragmentShader: `
    varying float vBrightness;
    varying float vVisible;
    void main() {
      if (vVisible < 0.5) discard;
      vec2 d = gl_PointCoord - 0.5;
      float edge = smoothstep(0.5, 0.0, length(d));
      float alpha = edge * edge * 0.35;
      gl_FragColor = vec4(vec3(vBrightness), alpha);
    }
  `
});

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const points = new THREE.Points(geometry, material);
scene.add(points); // uma única draw call; o núcleo não é um mesh.

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
let distance = 8;
let orbitX = 0;
let orbitY = 2.2;
let targetX = 0;
let targetY = 2.2;
camera.position.set(0, 2.2, distance);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  targetX += (e.clientX - lastX) * 0.008;
  targetY = THREE.MathUtils.clamp(targetY + (e.clientY - lastY) * 0.008, -4.8, 4.8);
  lastX = e.clientX; lastY = e.clientY;
});
renderer.domElement.addEventListener('pointerup', () => { dragging = false; });
renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); distance = THREE.MathUtils.clamp(distance + e.deltaY * 0.004, 3.5, 16); }, { passive: false });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  material.uniforms.uTime.value += dt * 0.25;
  orbitX += (targetX - orbitX) * 0.08;
  orbitY += (targetY - orbitY) * 0.08;
  camera.position.set(Math.sin(orbitX) * distance, orbitY, Math.cos(orbitX) * distance);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
