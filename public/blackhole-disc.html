<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disco de acreção</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const COUNT = 26000;
const LANES = 6.0;
const TILT  = THREE.MathUtils.degToRad(63);
const CORE_R = 0.42;

/* ------------------------------------------------------------------
   1. SEMENTES
   Direção angular vem de uma esfera de Fibonacci (espaçamento de
   ângulo áureo) — distribuição equidistante, sem aglomerados.
   O raio fica concentrado perto do centro.
-------------------------------------------------------------------*/
const geo  = new THREE.BufferGeometry();
const seed = new Float32Array(COUNT * 2);   // [theta0, r]
const GA = Math.PI * (3 - Math.sqrt(5));

for (let i = 0; i < COUNT; i++) {
  const y  = 1 - (i / (COUNT - 1)) * 2;
  const rr = Math.sqrt(Math.max(0, 1 - y * y));
  const th = GA * i;
  seed[i*2+0] = Math.atan2(Math.sin(th) * rr, Math.cos(th) * rr);
  seed[i*2+1] = 0.9 + Math.pow(Math.random(), 0.55) * 2.6;
}
geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(COUNT*3), 3));
geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 2));

/* ------------------------------------------------------------------
   2. SHADER DOS PONTOS
-------------------------------------------------------------------*/
const mat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  depthTest: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uTime:  { value: 0 },
    uSize:  { value: 2.0 },
    uFocus: { value: 8.0 }
  },
  vertexShader: /* glsl */`
    attribute vec2 aSeed;                 // x = theta0, y = raio
    uniform float uTime, uSize, uFocus;
    varying float vBright;

    void main() {
      float theta0 = aSeed.x;
      float r      = aSeed.y;

      /* --- rotação kepleriana -------------------------------------
         omega ∝ r^-1.5. Raios internos giram mais rápido, então
         qualquer alinhamento inicial vira braço espiral sozinho.
         Nenhum braço é animado explicitamente.                    */
      float ang = theta0 + uTime * pow(r, -1.5);

      /* --- faixas em espiral --------------------------------------
         O termo desloca o ANGULO dos pontos, não só o brilho.
         Deslocar ângulo amontoa pontos de verdade; deslocar só a
         cor pintaria uma risca falsa sobre um disco uniforme.    */
      float phase = ${LANES.toFixed(1)} * theta0 - 3.4 * log(r);
      float lane  = sin(phase + fract(sin(theta0 * 91.7) * 43.1) * 0.44 - 0.22);
      float b     = clamp(0.18 + 0.9 * max(lane, 0.0), 0.0, 1.0);
      ang += (b - 0.5) * 0.35;
      vBright = b * b;

      /* --- disco fino ---------------------------------------------
         Espessura proporcional ao raio: 3% do raio local.         */
      vec3 p = vec3(cos(ang) * r, sin(ang * 0.0) * 0.0, sin(ang) * r);
      p.y = (fract(sin(r * 71.3) * 27.1) - 0.5) * 2.0 * 0.03 * r;
      p.xz = vec2(cos(ang) * r, sin(ang) * r);

      /* --- inclinação do disco ------------------------------------ */
      float c = cos(${TILT.toFixed(6)}), s = sin(${TILT.toFixed(6)});
      p.yz = mat2(c, -s, s, c) * p.yz;

      /* --- oclusão analítica raio-esfera --------------------------
         Com blending aditivo não há depth buffer, então a sombra é
         resolvida na mão: testa se o raio da câmera até o ponto
         atravessa a esfera do núcleo E se o ponto está atrás dela. */
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vec3 ro = vec3(0.0, 0.0, 0.0);            // câmera na origem do view space
      vec3 rd = normalize(mv.xyz - ro);
      vec3 sphereCenter = (modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
      vec3 oc = ro - sphereCenter;              // núcleo no centro do view space
      float bb = dot(oc, rd);
      float cc = dot(oc, oc) - ${(CORE_R*CORE_R).toFixed(6)};
      float disc = bb * bb - cc;
      float tHit = -bb - sqrt(max(disc, 0.0));
      float pointDistance = length(mv.xyz);
      bool blocked = disc > 0.0 && tHit > 0.0 && tHit < pointDistance;
      vBright *= blocked ? 0.0 : 1.0;

      gl_Position = projectionMatrix * mv;

      /* --- profundidade de campo falsa ----------------------------
         Plano de foco atrás do disco: pontos próximos do foco ficam
         pequenos e nítidos; longe dele estouram em discos macios.  */
      float coc = abs(-mv.z - uFocus) / uFocus;
      gl_PointSize = uSize * (0.35 + vBright * 2.4) * (1.0 + coc * 3.0)
                   * (300.0 / max(-mv.z, 0.001));
      if (vBright <= 0.0) gl_PointSize = 0.0;
    }`,
  fragmentShader: /* glsl */`
    varying float vBright;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d);
      a *= a;                       // saia larga, no lugar de um bloom pass
      // monocromático: o branco estourado vem do acúmulo aditivo, não da cor
      gl_FragColor = vec4(vec3(vBright), a * 0.30);
    }`
});

const scene = new THREE.Scene();
scene.add(new THREE.Points(geo, mat));

/* ------------------------------------------------------------------
   3. O NÚCLEO
   Empilhado em Z para ter volume: a sombra aparece como um corpo
   escuro com contorno, não um círculo recortado.
-------------------------------------------------------------------*/
const core = new THREE.Group();
const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
for (let i = 0; i < 26; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(CORE_R, 32, 16), coreMat);
  m.position.z = i * 0.05 - 0.6;
  core.add(m);
}
core.rotation.x = TILT;
// O núcleo vem primeiro; pontos da frente podem ser desenhados por cima.
// Pontos de trás são removidos pelo teste raio-esfera acima.
core.renderOrder = -10;
scene.add(core);

/* ------------------------------------------------------------------
   4. CÂMERA, RENDERER, LOOP
-------------------------------------------------------------------*/
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
ren.setSize(innerWidth, innerHeight);
ren.setClearColor(0x000000, 1);
document.body.appendChild(ren.domElement);

let yaw = 0, pitch = 0.28, dist = 8;
let tYaw = 0, tPitch = 0.28, tDist = 8, hoverYaw = 0, hoverPitch = 0;
let dragging = false, px = 0, py = 0;

addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener('pointerup',   () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) {
    hoverYaw = (e.clientX / innerWidth - 0.5) * 0.18;
    hoverPitch = (e.clientY / innerHeight - 0.5) * 0.12;
    return;
  }
  tYaw   += (e.clientX - px) * 0.005;
  tPitch += (e.clientY - py) * 0.005;
  tPitch = THREE.MathUtils.clamp(tPitch, -1.2, 1.2);
  px = e.clientX; py = e.clientY;
});
addEventListener('pointerleave', () => { hoverYaw = 0; hoverPitch = 0; });
addEventListener('wheel', e => {
  tDist = THREE.MathUtils.clamp(tDist + e.deltaY * 0.004, 3.5, 20);
}, { passive: true });

addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  ren.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
(function loop() {
  const t = (performance.now() - t0) / 1000;
  mat.uniforms.uTime.value = t * 0.25;

  if (!dragging) tYaw += 0.0009;                 // órbita perpétua
  yaw   += (tYaw + hoverYaw - yaw) * 0.06;
  pitch += (tPitch + hoverPitch - pitch) * 0.06;
  dist  += (tDist  - dist)  * 0.08;

  cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist,
                   Math.sin(pitch) * dist,
                   Math.cos(yaw) * Math.cos(pitch) * dist);
  cam.lookAt(0, 0, 0);

  ren.render(scene, cam);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
