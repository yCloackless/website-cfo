<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casca esférica</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

/* ------------------------------------------------------------------
   Espiral de Fibonacci numa casca esférica de raio 1.
   Equidistante por construção: sem random(), sem aglomerados,
   sem buracos. É a grade quase-perfeita que torna a imagem legível.
-------------------------------------------------------------------*/
const N = 6000;
const GA = Math.PI * (3 - Math.sqrt(5));
const pos = new Float32Array(N * 3);

for (let i = 0; i < N; i++) {
  const y = 1 - (i / (N - 1)) * 2;
  const r = Math.sqrt(Math.max(0, 1 - y * y));
  const th = GA * i;
  pos[i*3+0] = Math.cos(th) * r;
  pos[i*3+1] = y;
  pos[i*3+2] = Math.sin(th) * r;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

/* Blending NORMAL: os pontos não somam, não brilham, não estouram. */
const mat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  uniforms: { uSize: { value: 1.0 } },
  vertexShader: /* glsl */`
    uniform float uSize;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uSize;              // 1 pixel, fixo, sem attenuação
    }`,
  fragmentShader: /* glsl */`
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.35, d);   // ponto redondo suave, sem saia
      gl_FragColor = vec4(1.0, 1.0, 1.0, a);
    }`
});

const pts = new THREE.Points(geo, mat);
const scene = new THREE.Scene();
scene.add(pts);

/* ------------------------------------------------------------------
   Enquadramento: a esfera ocupa ~70% da largura da janela.
-------------------------------------------------------------------*/
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
ren.setSize(innerWidth, innerHeight);
ren.setClearColor(0x000000, 1);
document.body.appendChild(ren.domElement);

function fit() {
  const h = 2 * Math.tan(THREE.MathUtils.degToRad(cam.fov * 0.5));
  const w = h * cam.aspect;
  return 1 / Math.min(w, h) / 0.7 * 0.5;   // distância para preencher 70%
}

let yaw = 0, pitch = 0, tYaw = 0, tPitch = 0, hoverYaw = 0, hoverPitch = 0;
let zoom = 1, dragging = false, px = 0, py = 0;

addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener('pointerup',   () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) {
    hoverYaw = (e.clientX / innerWidth - 0.5) * 0.22;
    hoverPitch = (e.clientY / innerHeight - 0.5) * 0.14;
    return;
  }
  tYaw   += (e.clientX - px) * 0.006;
  tPitch += (e.clientY - py) * 0.006;
  tPitch = THREE.MathUtils.clamp(tPitch, -1.4, 1.4);
  px = e.clientX; py = e.clientY;
});
addEventListener('pointerleave', () => { hoverYaw = 0; hoverPitch = 0; });
addEventListener('wheel', e => {
  zoom = THREE.MathUtils.clamp(zoom + e.deltaY * 0.0008, 0.72, 1.45);
}, { passive: true });

addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  ren.setSize(innerWidth, innerHeight);
});

(function loop() {
  if (!dragging) tYaw += 0.0022;                 // rotação lenta contínua
  yaw   += (tYaw + hoverYaw - yaw) * 0.08;
  pitch += (tPitch + hoverPitch - pitch) * 0.08;

  pts.rotation.set(pitch, yaw, 0);
  cam.position.set(0, 0, fit() * zoom);
  cam.lookAt(0, 0, 0);

  ren.render(scene, cam);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
