<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Esfera de Fibonacci — point cloud</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;cursor:grab}canvas:active{cursor:grabbing}</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

const COUNT = 6000;
const positions = new Float32Array(COUNT * 3);
for (let i = 0; i < COUNT; i++) {
  // Esfera de Fibonacci determinística: sem random, sem agrupamentos.
  const y = 1 - (2 * i) / (COUNT - 1);
  const r = Math.sqrt(1 - y * y);
  const theta = i * Math.PI * (3 - Math.sqrt(5));
  positions[i * 3] = Math.cos(theta) * r;
  positions[i * 3 + 1] = y;
  positions[i * 3 + 2] = Math.sin(theta) * r;
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const material = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  uniforms: { uPixelRatio: { value: Math.min(devicePixelRatio, 2) } },
  vertexShader: `
    uniform float uPixelRatio;
    void main() {
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = 1.5 * uPixelRatio;
    }
  `,
  fragmentShader: `
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      if (length(d) > 0.5) discard;
      gl_FragColor = vec4(1.0, 1.0, 1.0, 0.95);
    }
  `
});

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const sphere = new THREE.Points(geometry, material);
scene.add(sphere); // somente pontos; nenhuma luz, mesh ou textura.

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
let distance = 3.2;
let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
camera.position.z = distance;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  targetX += (e.clientX - lastX) * 0.008;
  targetY += (e.clientY - lastY) * 0.008;
  lastX = e.clientX; lastY = e.clientY;
});
renderer.domElement.addEventListener('pointerup', () => { dragging = false; });
renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); distance = THREE.MathUtils.clamp(distance + e.deltaY * 0.002, 1.8, 7); }, { passive: false });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); material.uniforms.uPixelRatio.value = Math.min(devicePixelRatio, 2); });

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (!dragging) { targetX += dt * 0.12; targetY += dt * 0.025; }
  currentX += (targetX - currentX) * 0.08;
  currentY += (targetY - currentY) * 0.08;
  sphere.rotation.y = currentX;
  sphere.rotation.x = currentY;
  camera.position.z += (distance - camera.position.z) * 0.1;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
